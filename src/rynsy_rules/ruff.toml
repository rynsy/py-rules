line-length = 110
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "TD", "FIX",
    "ERA001",
    "EM101", "EM102", "TRY003",
    "PLR0913",
    "CPY",
    "TC001", "TC002", "TC003",
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN", "PLR2004", "ARG", "SLF001", "S105", "S106", "INP001", "TID251"]
"**/scripts/**" = ["T201", "INP001"]
"**/main.py" = ["TID251"]

[lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "A sleep hides a race. Await the event, or use the retry policy. Tests may sleep."
"asyncio.sleep".msg = "A sleep hides a race. Await the event, or use the retry policy. Tests may sleep."
"datetime.datetime.now".msg = "Inject a clock (a `Callable[[], datetime]`) from main.py, the composition root."
"datetime.datetime.utcnow".msg = "Inject a clock (a `Callable[[], datetime]`) from main.py, the composition root."
"datetime.datetime.today".msg = "Inject a clock (a `Callable[[], datetime]`) from main.py, the composition root."
"datetime.date.today".msg = "Inject a clock (a `Callable[[], datetime]`) from main.py, the composition root."
"time.time".msg = "Inject a clock from main.py; for durations use `time.monotonic`."
