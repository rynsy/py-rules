[project]
name = "rynsy-py-rules"
version = "0.3.1"
description = "Shared Python lint rules: corrections become deterministic checks"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
rynsy-rules = "rynsy_rules.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rynsy_rules"]

[tool.ruff]
extend = ".ruff-rynsy.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/test_consumer.py" = ["S603"]
"src/rynsy_rules/report.py" = ["S314"]
"src/rynsy_rules/comments.py" = ["S603"]
"tests/test_comments.py" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
